name: check expertise
on:
  push:
    branches: ['agent/codex/**']
permissions:
  contents: read
  statuses: write
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Select dependent browser checks
        id: scope
        run: |
          python3 - <<'PY'
          import os,subprocess
          base=subprocess.check_output(['git','merge-base','HEAD','origin/main'],text=True).strip()
          paths=subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines()
          def metadata(p):
              return p.endswith('.md') or p.startswith('lab/') or p in ['lab.yaml','elements.yaml','system.yaml','.github/workflows/check-expertise.yml']
          needed=any(not metadata(p) for p in paths)
          # Unknown executable/assets/templates changes widen scope; lab/report-only changes do not.
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('browser='+str(needed).lower()+'\n')
          print('Browser checks required:',needed)
          PY
      - uses: actions/setup-python@v5
        if: steps.scope.outputs.browser == 'true'
        with:
          python-version: '3.12'
      - if: steps.scope.outputs.browser == 'true'
        run: pip install -q playwright pillow pyyaml jsonschema
      - if: steps.scope.outputs.browser == 'true'
        run: python -m playwright install --with-deps chromium
      - name: Check the static site and visitor journeys
        id: test
        if: steps.scope.outputs.browser == 'true'
        run: |
          python3 tools/test_images.py
          python3 check.py
          python3 .system/tools/plyn_validate.py . --formats .system/formats
          node --check assets/expertise.js
          node --check assets/interactions.js
          python3 tools/test_expertise.py
          python3 tools/snap.py base --pages templates/expertise templates/expertise-experts --regimes mobile desktop wide narrow short sideways --dark
          python3 tools/thumbs.py expertise
          python3 tools/thumbs.py expertise-portal expertise-editorial expertise-association
          python3 tools/reader.py templates/expertise templates/expertise-experts
          python3 tools/reader.py templates/expertise-portal templates/expertise-editorial templates/expertise-association
          python3 tools/reader.py templates/expertise-opinion-portal templates/expertise-opinion-editorial templates/expertise-opinion-association
      - uses: actions/upload-artifact@v4
        if: always() && steps.scope.outputs.browser == 'true'
        with:
          name: expertise-browser-check
          path: |
            .snap/base
            .snap/concepts
            .snap/profiles
            .snap/opinions
            assets/templates/expertise.webp
            assets/templates/expertise-*.webp
      - name: Post the result on the commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.test.outcome }}
          NEED_BROWSER: ${{ steps.scope.outputs.browser }}
        run: |
          if [ "$OUTCOME" = "success" ] || [ "$NEED_BROWSER" = "false" ]; then state=success; else state=failure; fi
          gh api repos/${{ github.repository }}/statuses/${{ github.sha }} -f state="$state" -f context=check/expertise -f description="Expertise layout and visitor journeys" -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > /dev/null
